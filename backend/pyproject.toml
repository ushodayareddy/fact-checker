[project]
name = "fact-checker"
version = "0.1.0"
description = "Agentic fact-checking for Indian languages"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "lingua-language-detector>=2.0",
    "trafilatura>=2.0",
    "numpy>=2.0",
    "cssselect>=1.6.0",
    "lxml>=6.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
